name: Generate brand PNGs

on:
  workflow_dispatch:
  push:
    branches: [feat/brand-assets]
    paths:
      - brand-src/**
      - .github/workflows/convert-brand.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Rasterize SVG to HACS PNG sizes
        run: |
          set -euo pipefail
          BRAND=custom_components/electric_heater/brand
          mkdir -p "$BRAND"
          convert -background none brand-src/icon.svg -resize 256x256 PNG32:"$BRAND/icon.png"
          convert -background none brand-src/icon.svg -resize 512x512 PNG32:"$BRAND/icon@2x.png"
          cp "$BRAND/icon.png" "$BRAND/dark_icon.png"
          cp "$BRAND/icon@2x.png" "$BRAND/dark_icon@2x.png"
          convert -background white brand-src/logo.svg -resize x256 PNG32:"$BRAND/logo.png"
          convert -background white brand-src/logo.svg -resize x512 PNG32:"$BRAND/logo@2x.png"
          convert -background '#1B2A41' brand-src/dark_logo.svg -resize x256 PNG32:"$BRAND/dark_logo.png"
          convert -background '#1B2A41' brand-src/dark_logo.svg -resize x512 PNG32:"$BRAND/dark_logo@2x.png"
          identify "$BRAND"/*

      - name: Commit brand assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/electric_heater/brand
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat(brand): add HACS icon and logo for Chauffage Fil Pilote FR"
          git push
