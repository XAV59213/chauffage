name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release (ex. 3.0.3), identique à la version de manifest.json et const.py
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la version
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MANIFEST_VERSION=$(jq -r '.version' custom_components/electric_heater/manifest.json)
          CONST_VERSION=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' custom_components/electric_heater/const.py)
          if [ "$TAG" != "$MANIFEST_VERSION" ] || [ "$TAG" != "$CONST_VERSION" ]; then
            echo "::error::Le tag ($TAG) doit être égal à manifest.json ($MANIFEST_VERSION) et const.py ($CONST_VERSION)"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::La release $TAG existe déjà"
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          target_commitish: main
          generate_release_notes: true

  zip:
    name: Zip HACS
    needs: release
    uses: ./.github/workflows/release-zip.yaml
    with:
      tag: ${{ inputs.tag }}
