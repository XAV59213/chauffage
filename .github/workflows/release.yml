name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de la release
        type: string
        default: "1.1.3"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          target_commitish: main
          generate_release_notes: true
          body: |
            ## What's Changed
            * fix: capteurs Inconnu et extinction du radiateur by @XAV59213 in https://github.com/XAV59213/chauffage/pull/6

            Les capteurs Temperature Centrale et Chauffage Actif suivent maintenant le thermostat.
            Eteindre le thermostat virtuel envoie l'ordre off au relais fil pilote.

            **Full Changelog**: https://github.com/XAV59213/chauffage/compare/1.1.2...1.1.3
