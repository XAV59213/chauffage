# Auto-évaluation Integration Quality Scale (custom HACS, aucun niveau officiel revendiqué).
# "done" uniquement avec preuve dans le code ; sinon todo/exempt justifié.
rules:
  # Bronze
  action-setup:
    status: exempt
    comment: L'intégration n'enregistre aucune action (service) propre.
  appropriate-polling:
    status: done
    comment: iot_class local_push ; entités pilotées par événements d'état, pas de should_poll.
  brands:
    status: done
    comment: Icônes et logos dans custom_components/electric_heater/brand/.
  common-modules:
    status: done
    comment: entity.py (CentralEntity, RoomEntity, device_info communs) utilisé par climate, sensor, binary_sensor et stats ; pas de coordinator (intégration événementielle, aucune interrogation périodique d'API).
  config-flow:
    status: done
    comment: config_flow.py avec sélecteurs et options flow ; manifest config_flow true.
  config-flow-test-coverage:
    status: done
    comment: tests/test_config_flow.py et tests/test_config_helpers.py couvrent création central/pièce, erreurs, doublon (abort), options et sélecteurs ; config_flow.py couvert à 100 %.
  dependency-transparency:
    status: done
    comment: requirements vide dans manifest.json.
  docs-actions:
    status: exempt
    comment: Aucune action propre exposée.
  docs-conditions:
    status: exempt
    comment: Aucune condition d'automatisation propre.
  docs-high-level-description:
    status: done
    comment: README.md / wiki/Home.md.
  docs-installation-instructions:
    status: done
    comment: README.md section Installation (HACS et manuelle).
  docs-removal-instructions:
    status: done
    comment: Section Suppression dans wiki/Reference.md.
  docs-triggers:
    status: exempt
    comment: Aucun déclencheur d'automatisation propre.
  entity-event-setup:
    status: done
    comment: Abonnements dans async_added_to_hass et désabonnement via async_on_remove (climate.py, sensor.py).
  entity-unique-id:
    status: done
    comment: _attr_unique_id sur toutes les entités (climate.py, sensor.py, binary_sensor.py, stats.py).
  has-entity-name:
    status: done
    comment: _attr_has_entity_name = True sur toutes les entités.
  runtime-data:
    status: done
    comment: Données par entrée dans entry.runtime_data (ElectricHeaterConfigEntry / ElectricHeaterData) ; hass.data[DOMAIN] garde seulement l'état global au domaine (carte Lovelace, caches, alertes).
  test-before-configure:
    status: exempt
    comment: Aucun appareil ni service distant à joindre ; seules des entités HA existantes sont sélectionnées.
  test-before-setup:
    status: exempt
    comment: Aucune connexion externe à tester au démarrage.
  unique-config-entry:
    status: done
    comment: async_set_unique_id + _abort_if_unique_id_configured (config_flow.py, central et pièces).

  # Silver
  action-exceptions:
    status: exempt
    comment: Aucune action propre.
  config-entry-unloading:
    status: done
    comment: async_unload_entry avec async_unload_platforms et entry.async_on_unload (__init__.py).
  docs-configuration-parameters:
    status: done
    comment: wiki/Configuration.md.
  docs-installation-parameters:
    status: done
    comment: wiki/Configuration.md.
  entity-unavailable:
    status: done
    comment: Les capteurs qui recopient une source (température pièce, température centrale, compteur du jour, calendrier) passent indisponibles avec elle (entity.py SourceAvailabilityMixin). Les thermostats restent volontairement disponibles quand la sonde ou le relais tombe, pour appliquer la sécurité Hors-gel et signaler sonde_ko ; ce sont eux qui pilotent, pas des recopies.
  integration-owner:
    status: done
    comment: codeowners @XAV59213 dans manifest.json.
  log-when-unavailable:
    status: done
    comment: Une seule ligne de journal à la perte et au retour de la source (entity.py) ; climate journalise une fois la sonde KO / rétablie et le relais indisponible / revenu.
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 0 dans climate, sensor et binary_sensor.
  reauthentication-flow:
    status: exempt
    comment: Aucune authentification.
  test-coverage:
    status: done
    comment: 83 tests pytest (tests/) lancés en CI ; couverture globale 95 %.

  # Gold
  devices:
    status: done
    comment: Device central créé dans __init__.py et device_info sur les entités.
  diagnostics:
    status: done
    comment: diagnostics.py (configuration + états, service de notification masqué).
  discovery:
    status: exempt
    comment: Thermostat virtuel basé sur des entités HA existantes, rien à découvrir.
  discovery-update-info:
    status: exempt
    comment: Pas de découverte.
  docs-data-update:
    status: done
    comment: Section Mise à jour des données dans wiki/Reference.md.
  docs-examples:
    status: done
    comment: examples/lovelace et examples/lovelace-statut-chauffage.yaml.
  docs-known-limitations:
    status: done
    comment: Section Limitations connues dans wiki/Reference.md.
  docs-supported-devices:
    status: done
    comment: Section Appareils compatibles dans wiki/Reference.md.
  docs-supported-functions:
    status: done
    comment: wiki/Fonctionnement.md et README.
  docs-troubleshooting:
    status: done
    comment: wiki/Depannage.md.
  docs-use-cases:
    status: done
    comment: Section Cas d'usage dans wiki/Reference.md.
  dynamic-devices:
    status: exempt
    comment: Les pièces sont ajoutées par l'utilisateur via config flow (une entrée par radiateur).
  entity-category:
    status: done
    comment: EntityCategory.DIAGNOSTIC sur les capteurs de diagnostic.
  entity-device-class:
    status: done
    comment: device_class sur capteurs température, énergie, durée et binaires.
  entity-disabled-by-default:
    status: done
    comment: « Temperature Centrale » (doublon de current_temperature du central) et « Temperature exterieure » (doublon de l'entité météo) désactivées par défaut pour les nouvelles installations ; les entités déjà enregistrées ne changent pas.
  entity-translations:
    status: done
    comment: translation_key sur toutes les entités (strings.json, fr.json, en.json) ; le thermostat central garde le nom de l'appareil. Noms anglais identiques aux noms actuels pour ne changer ni entity_id ni nom visible (vérifié par tests/test_entity_names.py).
  exception-translations:
    status: done
    comment: ServiceValidationError traduite (invalid_preset) dans climate.py ; aucune autre exception levée par l'intégration.
  icon-translations:
    status: done
    comment: icons.json pour toutes les entités ; icônes dynamiques conservées seulement quand l'état est un texte libre (Presents, Etat fenetre, Fenêtres ouvertes, Sondes KO).
  reconfiguration-flow:
    status: done
    comment: async_step_reconfigure (central et radiateur) réutilise les formulaires de création ; changement de relais refusé s'il pilote déjà une autre pièce.
  repair-issues:
    status: done
    comment: Repair « entité introuvable » si la sonde ou le select fil pilote configuré n'existe plus (__init__.py).
  stale-devices:
    status: done
    comment: async_remove_config_entry_device, suppression d'un appareil sans entité de l'entrée (le central actif est protégé).

  # Platinum
  async-dependency:
    status: exempt
    comment: Aucune dépendance externe.
  inject-websession:
    status: exempt
    comment: Aucune requête HTTP sortante.
  strict-typing:
    status: done
    comment: py.typed présent, mypy --strict (mypy.ini) sans erreur, vérifié en CI.
